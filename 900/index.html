<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PSFree Host - صالة عمر نينو</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            /* وضع الصورة كخلفية للموقع بشكل كامل */
            background: linear-gradient(rgba(0, 0, 0, 0.65), rgba(0, 0, 0, 0.65)), url('bg.jpg') no-repeat center center fixed;
            background-size: cover;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            padding: 40px 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 25px;
        }

        .title {
            font-size: 3rem;
            font-weight: bold;
            margin-bottom: 10px;
            text-shadow: 2px 2px 5px rgba(0,0,0,0.8);
            color: #4CAF50;
        }

        .version-info {
            font-size: 1.2rem;
            margin-bottom: 15px;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.8);
        }

        .badge-fw {
            background-color: #2e7d32;
            padding: 6px 18px;
            border-radius: 20px;
            display: inline-block;
            font-weight: bold;
            font-size: 1rem;
            border: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        .status-box {
            text-align: center;
            margin: 15px 0 25px 0;
            background: rgba(0, 0, 0, 0.5);
            padding: 15px 30px;
            border-radius: 15px;
            backdrop-filter: blur(5px);
        }

        .status-title {
            font-size: 1.8rem;
            font-weight: bold;
            margin-bottom: 8px;
            color: #ffffff;
        }

        .stats {
            font-size: 1.1rem;
            color: #ddd;
        }

        .section-title {
            font-size: 1.5rem;
            margin: 15px 0;
            text-align: center;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.8);
        }

        .nav-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            width: 100%;
            max-width: 600px;
        }

        .btn {
            background-color: rgba(0, 0, 0, 0.6);
            border: 2px solid rgba(255, 255, 255, 0.4);
            color: white;
            padding: 15px;
            border-radius: 12px;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
            transition: all 0.2s ease;
            text-decoration: none;
            backdrop-filter: blur(4px);
        }

        .btn:hover, .btn:focus {
            background-color: rgba(46, 125, 50, 0.8);
            border-color: #ffffff;
            transform: scale(1.03);
            outline: none;
        }

        .btn-full {
            grid-column: span 2;
        }
    </style>
</head>
<body>

    <!-- الهيدر والعناوين -->
    <div class="header">
        <h1 class="title">4GAMER PSFree Host</h1>
        <p class="version-info">PSFree1.5rc1 (Idle) v2.4b18.8</p>
        <div class="badge-fw">FW - 9.00</div>
    </div>

    <!-- حالة الكسر والإحصائيات -->
    <div class="status-box">
        <h2 class="status-title">جاهز لكسر الحماية</h2>
        <p class="stats">محاولات ناجحة: <span id="success-count">1548</span> | محاولات فاشلة: <span id="fail-count">136</span></p>
    </div>

    <!-- قسم التنقل والأزرار -->
    <h3 class="section-title">التنقل</h3>

    <div class="nav-grid">
        <button class="btn" onclick="loadPayload('apps')">التطبيقات</button>
        <button class="btn" onclick="loadPayload('tools')">الأدوات</button>
        <button class="btn btn-full" onclick="loadPayload('modmenu')">المود منيو</button>
    </div>

    <script>
        function loadPayload(type) {
            alert("جاري تشغيل: " + type);
        }
    </script>
</body>
</html>
